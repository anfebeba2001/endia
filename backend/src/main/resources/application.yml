server:
  port: 8080

spring:
  application:
    name: endia-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:endia}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

# LLM configuration
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: 30

# Batch / async retry configuration (FR-016/017/018)
batch:
  # 009: per-subtopic wall-clock bound around snack generation (includes retries + one re-roll).
  snack-timeout-seconds: ${BATCH_SNACK_TIMEOUT_SECONDS:240}
  # 009: wall-clock bound on the parallel quiz prefetch join.
  quiz-join-timeout-seconds: ${BATCH_QUIZ_JOIN_TIMEOUT_SECONDS:240}
  retry:
    max-attempts: ${BATCH_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${BATCH_RETRY_INITIAL_BACKOFF_MS:1000}
    backoff-factor: ${BATCH_RETRY_BACKOFF_FACTOR:2.0}
    max-backoff-ms: ${BATCH_RETRY_MAX_BACKOFF_MS:10000}
    jitter-ratio: ${BATCH_RETRY_JITTER_RATIO:0.2}

# CORS for development (Angular at 4200)
app:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
